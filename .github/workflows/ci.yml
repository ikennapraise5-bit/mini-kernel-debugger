name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ========== Python tests (parallel across versions) ==========
  test-python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Test Python version
      run: |
        echo -e "hello\nhello Grok\nhelp\nquit" | python3 mini_kdb.py

  # ========== C builds (parallel across compilers) ==========
  build-c:
    name: C (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install compiler & ccache
      run: |
        sudo apt-get update
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get install -y clang ccache
        else
          sudo apt-get install -y ccache
        fi
        echo "/usr/lib/ccache" >> $GITHUB_PATH

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ matrix.compiler }}-ccache-${{ hashFiles('**/kdb_hello.c', '**/Makefile') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.compiler }}-ccache-

    - name: Build with ${{ matrix.compiler }}
      run: |
        export CC="ccache ${{ matrix.cc }}"
        make
        ls -la mini-kdb
        ccache -s

    - name: Test C binary
      run: |
        echo -e "hello\nhello CI\nhelp\nquit" | ./mini-kdb

  # ========== Summary job (optional, shows overall status) ==========
  ci-success:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [test-python, build-c]
    if: always()
    steps:
    - name: Check results
      run: |
        if [ "${{ needs.test-python.result }}" != "success" ] || [ "${{ needs.build-c.result }}" != "success" ]; then
          echo "One or more jobs failed"
          exit 1
        fi
        echo "All matrix jobs passed!"
