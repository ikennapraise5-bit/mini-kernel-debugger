name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'   # Cache pip dependencies

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ hashFiles('**/kdb_hello.c', '**/Makefile') }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Install ccache
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache
        echo "/usr/lib/ccache" >> $GITHUB_PATH

    - name: Build C version (with ccache)
      run: |
        export CC="ccache gcc"
        make
        ls -la mini-kdb
        ccache -s   # Show cache stats

    - name: Test Python version
      run: |
        echo -e "hello\nhello Grok\nhelp\nquit" | python3 mini_kdb.py

    - name: Test C version
      run: |
        echo -e "hello\nhello CI\nhelp\nquit" | ./mini-kdb
