name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ========== Python tests + coverage (parallel across versions) ==========
  test-python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install coverage tools
      run: pip install coverage

    - name: Run tests with coverage
      run: |
        echo -e "hello\nhello Grok\nhelp\nquit" | coverage run --source=. -a mini_kdb.py

    - name: Generate coverage report
      run: |
        coverage report -m
        coverage xml -o coverage-python.xml
        coverage html -d htmlcov-python

    - name: Upload Python coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-python-${{ matrix.python-version }}
        path: |
          coverage-python.xml
          htmlcov-python/
        retention-days: 14

    - name: Upload to Codecov (Python)
      uses: codecov/codecov-action@v5
      with:
        files: coverage-python.xml
        flags: python
        name: python-${{ matrix.python-version }}
        fail_ci_if_error: false

  # ========== C builds + coverage (parallel across compilers) ==========
  build-c:
    name: C (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install tools
      run: |
        sudo apt-get update
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get install -y clang ccache lcov
        else
          sudo apt-get install -y ccache lcov
        fi
        echo "/usr/lib/ccache" >> $GITHUB_PATH

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ matrix.compiler }}-ccache-${{ hashFiles('**/kdb_hello.c', '**/Makefile') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.compiler }}-ccache-

    - name: Build with coverage flags
      run: |
        export CC="ccache ${{ matrix.cc }}"
        export CFLAGS="-O0 -g --coverage"
        export LDFLAGS="--coverage"
        make clean || true
        make
        ls -la mini-kdb

    - name: Run tests (generate .gcda)
      run: |
        echo -e "hello\nhello CI\nhelp\nunknown\nquit" | ./mini-kdb

    - name: Generate coverage report (gcov/lcov)
      run: |
        gcov kdb_hello.c || true
        lcov --capture --directory . --output-file coverage-c.info --rc lcov_branch_coverage=1 || true
        lcov --list coverage-c.info || true
        genhtml coverage-c.info --output-directory htmlcov-c || true

    - name: Upload C coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-c-${{ matrix.compiler }}
        path: |
          coverage-c.info
          htmlcov-c/
          *.gcov
        retention-days: 14

    - name: Upload to Codecov (C)
      uses: codecov/codecov-action@v5
      with:
        files: coverage-c.info
        flags: c
        name: c-${{ matrix.compiler }}
        fail_ci_if_error: false

  # ========== Summary job ==========
  ci-success:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [test-python, build-c]
    if: always()
    steps:
    - name: Check results
      run: |
        if [ "${{ needs.test-python.result }}" != "success" ] || [ "${{ needs.build-c.result }}" != "success" ]; then
          echo "One or more jobs failed"
          exit 1
        fi
        echo "All matrix jobs + coverage reporting passed!"
